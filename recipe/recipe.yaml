schema_version: 1

context:
  name: flask-assets-pipeline
  version: "0.8.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/flask_assets_pipeline-${{ version }}.tar.gz
  sha256: 1de032a8762a52b4896312e7da09178924ce23eae52bb13b660bc0e35b30dfa9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.8.11,<0.9.0
    - pip
  run:
    - python >=${{ python_min }}
    - flask ~=3.0
    - watchdog ~=6.0

tests:
  - python:
      imports:
        - flask_assets_pipeline
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/hyperflask/flask-assets-pipeline
  summary: Modern asset pipeline for Flask
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
